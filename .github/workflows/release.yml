name: Release asset

# ghrelease tags a merged, CI-green commit and publishes the release; this
# attaches the .vsix to it. Nothing is published to the Marketplace.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - name: Attach the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./*.vsix --clobber
